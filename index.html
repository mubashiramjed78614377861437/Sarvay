<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b35"><title>Road Survey Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light;--bg:#f4f7f8;--panel:#fff;--ink:#102a2a;--muted:#667a7a;--line:#e0e8e8;--accent:#087e72;--accent2:#075e57;--soft:#e4f5f1;--danger:#b42318;--shadow:0 8px 28px rgba(14,45,45,.07)}
[data-theme=dark]{color-scheme:dark;--bg:#0c1517;--panel:#142225;--ink:#edf7f5;--muted:#9cb2b0;--line:#2b4142;--accent:#50c7b4;--accent2:#76decd;--soft:#1b3836;--danger:#ff8b82;--shadow:0 8px 28px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid transparent;border-radius:13px;padding:12px 15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:750;box-shadow:0 4px 12px #087e7222}button:active{transform:scale(.98)}button.secondary{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:none}button.danger{background:var(--danger)}button.small{padding:8px 11px;font-size:12px;border-radius:10px}.top{background:linear-gradient(130deg,#092e31,#075c55 68%,#0b7b6e);color:#fff;padding:20px 16px 18px;position:sticky;top:0;z-index:4;box-shadow:0 8px 25px #042a2a29}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:850;letter-spacing:-.035em}.brand .mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#fff,#d9f8ef);color:#075c55;display:grid;place-items:center;font-weight:950;font-size:16px}.sub{font-size:11px;font-weight:550;letter-spacing:.04em;color:#c9e6df;margin-top:2px}.search{width:100%;padding:14px 16px;border-radius:15px;border:1px solid #ffffff35;margin-top:16px;background:#fff;color:#173534;outline:none}.search:focus{box-shadow:0 0 0 3px #9de5d7}.wrap{max-width:980px;margin:auto;padding:18px 14px 112px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}.actions button{min-height:62px;text-align:left;padding:13px 14px;line-height:1.3}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 12px}.section-head h2{font-size:16px;margin:0;font-weight:850;letter-spacing:-.025em}.muted{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:15px;min-width:0;box-shadow:var(--shadow)}.card h3{margin:0 0 6px;font-size:14px;font-weight:800;overflow-wrap:anywhere}.tag{display:inline-block;background:var(--soft);color:var(--accent2);padding:4px 9px;border-radius:99px;font-size:10px;font-weight:750;margin:4px 4px 0 0}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:var(--muted);padding:7px 10px;font-size:10px;display:grid;gap:3px;justify-items:center;box-shadow:none;border:0;min-width:54px}.nav button.active{color:var(--accent);background:var(--soft);border-radius:13px}.nav span{font-size:20px}.fab{position:fixed;right:18px;bottom:83px;width:58px;height:58px;border-radius:20px;font-size:29px;box-shadow:0 8px 24px #087e7245;z-index:5;padding:0;background:linear-gradient(145deg,#0a9c8a,#075e57)}.hidden{display:none!important}.list{display:grid;gap:10px}.file-card{display:flex;gap:11px;align-items:center}.file-icon{width:46px;height:49px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:900;font-size:10px;flex-shrink:0;border:1px solid var(--line)}.file-info{min-width:0;flex:1}.file-info h3{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.file-info p{margin:3px 0;color:var(--muted);font-size:11px;overflow-wrap:anywhere}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.02em}.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none;min-height:46px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #087e7226}.field textarea{min-height:90px;resize:vertical}.modal{position:fixed;inset:0;background:#071d1dcc;backdrop-filter:blur(5px);z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:680px;max-height:94dvh;overflow:auto;border:1px solid var(--line);border-radius:25px 25px 0 0;padding:22px 17px calc(30px + env(safe-area-inset-bottom));box-shadow:0 -12px 45px #001a1a20}.sheet h2{margin:0 0 10px;font-size:21px;letter-spacing:-.04em;font-weight:900}.sheet-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.sheet-actions button{flex:1}.preview{width:100%;max-height:62dvh;object-fit:contain;background:#111;border-radius:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:var(--soft);padding:11px 4px;border-radius:13px;text-align:center;border:1px solid var(--line)}.stat strong{display:block;font-size:19px;font-weight:900}.stat span{font-size:9px;color:var(--muted);font-weight:750}.empty{text-align:center;padding:34px 16px;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:18px}.calc-screen{font-size:30px;font-weight:750;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;overflow-wrap:anywhere;min-height:76px;font-variant-numeric:tabular-nums}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.calc-grid button{padding:16px 5px;min-height:53px;font-size:17px;border-radius:14px}.notice{background:var(--soft);border:1px solid var(--line);padding:13px 14px;border-radius:15px;font-size:12px;color:var(--muted);margin:13px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:var(--panel);color:var(--ink);font-size:12px;box-shadow:none}.toolbar{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.toolbar button{white-space:nowrap}.thumb{width:52px;height:52px;object-fit:cover;border-radius:12px}.danger-text{color:var(--danger)}.file-picker{display:block;width:100%;padding:18px;border:1.5px dashed var(--accent);border-radius:16px;background:var(--soft);color:var(--ink)}.file-picker::file-selector-button{border:0;border-radius:10px;padding:10px 12px;background:var(--accent);color:#fff;font-weight:800;margin-right:10px}@media(min-width:650px){.actions{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.modal{align-items:center}.sheet{border-radius:24px}.wrap{padding-left:22px;padding-right:22px}.top{padding-left:max(20px,calc((100vw - 936px)/2));padding-right:max(20px,calc((100vw - 936px)/2))}}
</style></head>
<body>
<header class="top"><div class="brand"><div class="mark">RS</div><div>Road Survey Manager<div class="sub">Private • Local-first • Offline workspace</div></div></div><input id="search" class="search" placeholder="Search roads, chainage, tags, notes, files…" autocomplete="off"></header>
<main class="wrap" id="app"></main>
<button class="fab" id="fab" aria-label="Quick add">+</button>
<nav class="nav" id="nav"><button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="projects"><span>▤</span>Projects</button><button data-page="files"><span>▣</span>Files</button><button data-page="favorites"><span>☆</span>Favorites</button><button data-page="more"><span>☰</span>More</button></nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
let db, page='home', query='', currentProject=null, calcExpr='', history=[], selectedFile=null, pendingFiles=[];
const request=indexedDB.open('RoadSurveyManagerDB',1);
request.onupgradeneeded=()=>{const d=request.result;d.createObjectStore('projects',{keyPath:'id'});d.createObjectStore('files',{keyPath:'id'});d.createObjectStore('notes',{keyPath:'id'});d.createObjectStore('settings',{keyPath:'key'});};
request.onsuccess=()=>{db=request.result;render();};
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function all(name){return new Promise((res,rej)=>{let r=store(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(name,v){return new Promise((res,rej)=>{let t=db.transaction(name,'readwrite');t.objectStore(name).put(v);t.oncomplete=()=>res(v);t.onerror=()=>rej(t.error)})}
function del(name,id){return new Promise((res,rej)=>{let t=db.transaction(name,'readwrite');t.objectStore(name).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function fmtSize(n){if(!n)return '—';let u=['B','KB','MB','GB'],i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]}
function extOf(n){return (n.split('.').pop()||'FILE').toUpperCase()}
function category(f){let e=(f.name||f.originalName||'').split('.').pop().toLowerCase();if(['pdf'].includes(e))return'PDFs';if(['jpg','jpeg','png','gif','webp','heic','bmp'].includes(e))return'Images';if(['dwg','dxf'].includes(e))return'CAD';if(['doc','docx','xls','xlsx','txt','csv','rtf'].includes(e))return'Documents';return'Other'}
function matches(o){if(!query)return true;return Object.values(o).some(v=>typeof v==='string'&&v.toLowerCase().includes(query.toLowerCase()))}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden');pendingFiles=[]}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#search').addEventListener('input',e=>{query=e.target.value.trim();render()});
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;currentProject=null;render()}});
$('#fab').onclick=()=>quickAdd();
function projectForm(p={}){openModal(`<h2>${p.id?'Edit':'Add'} project</h2><form id="projectForm">
${[['name','Project name'],['road','Road name'],['code','Road code'],['location','Location'],['date','Date'],['client','Client / department'],['contractor','Contractor (optional)'],['tags','Tags (comma separated)']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" value="${esc(p[k]||'')}" ${k==='name'?'required':''} ${k==='date'?'type="date"':''}></div>`).join('')}
<div class="field"><label>Description / notes</label><textarea name="description">${esc(p.description||'')}</textarea></div><div class="sheet-actions"><button>Save project</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);
$('#projectForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));await put('projects',{...p,...d,id:p.id||uid(),favorite:p.favorite||false,created:p.created||Date.now()});closeModal();render()}}
async function fileImport(){openModal(`<h2>Import from phone storage</h2><p class="muted">Choose one or multiple files. Android's system picker will let you browse accessible folders, Downloads and SD card where supported.</p><div class="field"><label>Select files from phone</label><input id="pickFiles" class="file-picker" type="file" multiple accept="*/*"><div id="pickedSummary" class="muted">No files selected yet</div></div><div class="field"><label>Assign to project</label><select id="bulkProject"><option value="">Unassigned</option>${(await all('projects')).map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.code||'no code')})</option>`).join('')}</select></div><div class="notice">Android ka system file picker khulega. Sirf selected files ki access milti hai; aam tor par broad storage permission zaroori nahi hoti. Large files browser storage limit ki wajah se fail ho sakti hain.</div><div class="sheet-actions"><button id="doImport">Import selected files</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`);
$('#pickFiles').onchange=e=>{pendingFiles=[...e.target.files];let sum=$('#pickedSummary');if(sum)sum.textContent=pendingFiles.length?`${pendingFiles.length} file(s) selected • ${pendingFiles.reduce((n,f)=>n+f.size,0).toLocaleString()} bytes total`:'No files selected';};
$('#doImport').onclick=async()=>{if(!pendingFiles.length){alert('Pehle phone se file select karo.');return}const btn=$('#doImport');btn.disabled=true;btn.textContent='Importing…';try{let pid=$('#bulkProject').value;let map=Array.from(window.__nativeImportMap||[]);let imported=0;for(const f of pendingFiles){let ix=map.findIndex(x=>x.name===f.name&&Number(x.size)===Number(f.size));let native=ix>=0?map.splice(ix,1)[0]:null;let record={id:uid(),projectId:pid||'',name:f.name,originalName:f.name,ext:extOf(f.name),category:category(f),description:'',tags:'',date:new Date().toISOString().slice(0,10),size:f.size,favorite:false,demo:false,blob:f,nativeFileId:native?.id||'',mime:native?.mime||f.type||'application/octet-stream',created:Date.now(),lastModified:f.lastModified};await put('files',record);imported++;}pendingFiles=[];window.__nativeImportMap=[];closeModal();page='files';await render();alert(`${imported} file(s) imported. ${window.AndroidFiles?'Native local copies created where Android reported success.':'Stored in local app browser storage.'}`);}catch(err){btn.disabled=false;btn.textContent='Import selected files';alert('Import failed: '+(err?.message||err)+'\nStorage space ya file access check karo.');}}}
async function editFile(f){let ps=await all('projects');openModal(`<h2>Edit file information</h2><form id="fileForm"><div class="field"><label>Custom searchable name</label><input name="name" required value="${esc(f.name)}"></div><div class="field"><label>Original filename</label><input value="${esc(f.originalName)}" disabled></div><div class="field"><label>Project</label><select name="projectId"><option value="">Unassigned</option>${ps.map(p=>`<option value="${p.id}" ${p.id===f.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select name="category">${['PDFs','Images','CAD','Documents','Other'].map(c=>`<option ${c===f.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${esc(f.date||'')}"></div><div class="field"><label>Description</label><textarea name="description">${esc(f.description||'')}</textarea></div><div class="field"><label>Tags (comma separated)</label><input name="tags" value="${esc(f.tags||'')}"></div><div class="field"><label>Notes</label><textarea name="notes">${esc(f.notes||'')}</textarea></div><div class="sheet-actions"><button>Save changes</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);
$('#fileForm').onsubmit=async e=>{e.preventDefault();await put('files',{...f,...Object.fromEntries(new FormData(e.target))});closeModal();render()}}
async function openFile(f){if(f.blob){let url=URL.createObjectURL(f.blob);if(f.category==='Images'){openModal(`<h2>${esc(f.name)}</h2><img class="preview" src="${url}"><p class="muted">${esc(f.originalName)} • ${fmtSize(f.size)}</p><div class="sheet-actions"><button onclick="shareFile('${f.id}')">Share</button><button class="secondary" onclick="closeModal()">Close</button></div>`)}else if(f.category==='PDFs'){openModal(`<h2>${esc(f.name)}</h2><iframe src="${url}" style="width:100%;height:65vh;border:0;background:white;border-radius:12px"></iframe><div class="sheet-actions"><button onclick="openBlobExternal('${f.id}')">Open / download</button><button class="secondary" onclick="closeModal()">Close</button></div>`)}else{openModal(`<h2>${esc(f.name)}</h2><div class="notice">This file type may require a compatible external app (especially DWG/DXF). The original file is unchanged.</div><p>${esc(f.originalName)} • ${fmtSize(f.size)}</p><div class="sheet-actions"><button onclick="openBlobExternal('${f.id}')">Open With</button><button onclick="shareFile('${f.id}')">Share</button><button class="secondary" onclick="closeModal()">Close</button></div>`)} }else{openModal(`<h2>${esc(f.name)}</h2><div class="notice">Demo placeholder / file content unavailable. No real file was imported for this record.</div><p>${esc(f.originalName)}</p><div class="sheet-actions"><button class="secondary" onclick="closeModal()">Close</button></div>`)}}
async function openBlobExternal(id){let f=(await all('files')).find(x=>x.id===id);if(!f)return;if(f.nativeFileId&&window.AndroidFiles){let result=window.AndroidFiles.openImportedFile(f.nativeFileId);if(result==='MISSING')alert('Phone wali local copy nahi mili. File dobara import karo.');else if(result==='ERROR')alert('File open nahi ho saki. Compatible app check karo.');return}if(!f.blob){alert('Is record ke saath actual file content nahi hai. File dobara import karo.');return}let u=URL.createObjectURL(f.blob),a=document.createElement('a');a.href=u;a.download=f.originalName||f.name;a.target='_blank';a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function shareFile(id){let f=(await all('files')).find(x=>x.id===id);if(!f){alert('File record nahi mila.');return}if(f.nativeFileId&&window.AndroidFiles){let result=window.AndroidFiles.shareImportedFile(f.nativeFileId);if(result==='MISSING')alert('Phone wali local copy nahi mili. File dobara import karo.');return}if(!f.blob){alert('Is record ke saath actual file content nahi hai.');return}try{let file=new File([f.blob],f.originalName||f.name,{type:f.mime||f.blob.type});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:f.name});else{await openBlobExternal(id);alert('File download ke liye prepare ki gayi.')}}catch(e){}}
async function toggleFav(type,id){let o=(await all(type)).find(x=>x.id===id);if(!o)return;o.favorite=!o.favorite;await put(type,o);render()}
async function deleteFile(f){if(!confirm(`Delete "${f.name}"? This removes the file record${f.blob?' and its app-stored copy':''}. This cannot be undone.`))return;await del('files',f.id);render()}
async function deleteProject(p){if(!confirm(`Delete project "${p.name}"? Related files will be left unassigned, not deleted.`))return;for(let f of await all('files'))if(f.projectId===p.id){f.projectId='';await put('files',f)}for(let n of await all('notes'))if(n.projectId===p.id){n.projectId='';await put('notes',n)}await del('projects',p.id);currentProject=null;render()}
async function addNote(pid=''){openModal(`<h2>Add project note</h2><form id="noteForm"><div class="field"><label>Project</label><select name="projectId"><option value="">Unassigned</option>${(await all('projects')).map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Note</label><textarea name="body" required></textarea></div><div class="field"><label>Tags</label><input name="tags"></div><div class="sheet-actions"><button>Save note</button><button type="button" class="secondary" onclick="closeModal()">Cancel</button></div></form>`);$('#noteForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));await put('notes',{...d,id:uid(),date:new Date().toISOString().slice(0,10),created:Date.now()});closeModal();render()}}
async function quickAdd(){openModal(`<h2>Quick Add</h2><div class="list"><button onclick="closeModal();projectForm()">＋ Add Project</button><button onclick="fileImport()">▣ Add File</button><button onclick="photoImport()">▧ Add Photo</button><button onclick="closeModal();addNote()">✎ Add Note</button><button class="secondary" onclick="closeModal();calculator()">⌗ Quick Calculator</button></div>`)}
async function photoImport(){closeModal();openModal(`<h2>Add photo</h2><div class="field"><label>Select photo(s)</label><input type="file" id="photoPick" class="file-picker" accept="image/*" capture="environment" multiple></div><div class="field"><label>Project</label><select id="photoProject"><option value="">Unassigned</option>${(await all('projects')).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="notice">Supported phones par camera/photo chooser khul sakta hai; warna Gallery se photo select karo.</div><div class="sheet-actions"><button id="savePhotos">Import photos</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`);$('#savePhotos').onclick=async()=>{let fs=[...$('#photoPick').files];if(!fs.length)return alert('Select photos first.');for(let f of fs){let map=Array.from(window.__nativeImportMap||[]);let ix=map.findIndex(x=>x.name===f.name&&Number(x.size)===Number(f.size));let native=ix>=0?map[ix]:null;if(ix>=0)map.splice(ix,1);window.__nativeImportMap=map;await put('files',{id:uid(),projectId:$('#photoProject').value,name:f.name,originalName:f.name,ext:extOf(f.name),category:'Images',date:new Date().toISOString().slice(0,10),size:f.size,tags:'',description:'',favorite:false,demo:false,blob:f,nativeFileId:native?.id||'',mime:native?.mime||f.type||'image/*',created:Date.now()})}closeModal();page='files';render()}}
async function calculator(){openModal(`<h2>Quick Calculator</h2><div class="calc-screen" id="calcScreen">0</div><div class="calc-grid">${['7','8','9','÷','4','5','6','×','1','2','3','−','0','.','%','+','C','⌫','(',')','=','History'].map(k=>`<button class="${['C','⌫','History'].includes(k)?'secondary':''}" onclick="calcKey('${k}')">${k}</button>`).join('')}</div><div class="section-head"><h2>Survey tools</h2></div><div class="field"><label>Distance / difference (value B − value A)</label><div class="row"><input id="valA" type="number" placeholder="Value A" style="width:42%"><input id="valB" type="number" placeholder="Value B" style="width:42%"><button class="small" onclick="surveyCalc('diff')">=</button></div><div id="surveyOut" class="muted"></div></div><div class="field"><label>Unit conversion</label><div class="row"><input id="unitVal" type="number" value="1" style="width:24%"><select id="unitFrom" style="flex:1">${['m','km','ft','in','yd','m²','ft²'].map(x=>`<option>${x}</option>`).join('')}</select><span>to</span><select id="unitTo" style="flex:1">${['m','km','ft','in','yd','m²','ft²'].map(x=>`<option>${x}</option>`).join('')}</select><button class="small" onclick="surveyCalc('unit')">=</button></div><div id="unitOut" class="muted"></div></div><div class="sheet-actions"><button class="secondary" onclick="closeModal()">Close</button></div>`)}
function safeCalculate(input){let s=input.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');let i=0;function ws(){while(i<s.length&&/\s/.test(s[i]))i++}function expr(){let v=term();while(true){ws();if(s[i]==='+'){i++;v+=term()}else if(s[i]==='-'){i++;v-=term()}else return v}}function term(){let v=factor();while(true){ws();if(s[i]==='*'){i++;v*=factor()}else if(s[i]==='/'){i++;let d=factor();if(d===0)throw Error('Cannot divide by zero');v/=d}else return v}}function factor(){ws();if(s[i]==='+'){i++;return factor()}if(s[i]==='-'){i++;return -factor()}if(s[i]==='('){i++;let v=expr();ws();if(s[i++]!==')')throw Error('Bracket mismatch');return v}let m=s.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);if(!m)throw Error('Check expression');i+=m[0].length;return Number(m[0])}if(!s.trim())throw Error('Enter a calculation');let v=expr();ws();if(i<s.length||!Number.isFinite(v))throw Error('Check expression');return v}function calcKey(k){let s=$('#calcScreen');if(k==='C')calcExpr='';else if(k==='⌫')calcExpr=calcExpr.slice(0,-1);else if(k==='History'){openModal(`<h2>Calculation history</h2>${history.length?history.map(x=>`<p class="card">${esc(x)}</p>`).join(''):'<p class="muted">No calculations yet.</p>'}<button class="secondary" onclick="calculator()">Back</button>`);return}else if(k==='='){try{let result=safeCalculate(calcExpr);history.unshift(calcExpr+' = '+Number(result.toPrecision(12)));history=history.slice(0,30);calcExpr=String(Number(result.toPrecision(12)))}catch(e){s.textContent=e.message||'Invalid expression';return}}else calcExpr+=k;s.textContent=calcExpr||'0'}
function surveyCalc(type){if(type==='diff'){let a=Number($('#valA').value),b=Number($('#valB').value);$('#surveyOut').textContent=`Difference: ${b-a}`;return}let factors={m:1,km:1000,ft:.3048,in:.0254,yd:.9144,'m²':1,'ft²':.09290304};let a=$('#unitFrom').value,b=$('#unitTo').value,v=Number($('#unitVal').value);if((a.includes('²'))!==(b.includes('²'))){$('#unitOut').textContent='Length and area units cannot be converted directly.';return}$('#unitOut').textContent=`${v} ${a} = ${v*factors[a]/factors[b]} ${b}`}
async function render(){if(!db)return;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let ps=await all('projects'),fs=await all('files'),ns=await all('notes');let app=$('#app');if(currentProject){let p=ps.find(x=>x.id===currentProject);if(!p){currentProject=null;return render()}return renderProject(p,fs,ns)}
let matchedP=ps.filter(p=>matches(p)),matchedF=fs.filter(f=>matches(f)||matches(ps.find(p=>p.id===f.projectId)||{})),matchedN=ns.filter(matches);
const projectCard=p=>`<div class="card" onclick="currentProject='${p.id}';render()"><div class="between"><h3>${esc(p.name)}</h3><button class="small secondary" onclick="event.stopPropagation();toggleFav('projects','${p.id}')">${p.favorite?'★':'☆'}</button></div><div class="muted">${esc(p.road||'Road not set')} • ${esc(p.code||'No code')}</div><div class="muted">${esc(p.location||'')} ${p.demo?'<span class="tag">DEMO</span>':''}</div><div class="row">${(p.tags||'').split(',').filter(Boolean).slice(0,3).map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</div></div>`;
const fileCard=f=>{let p=ps.find(x=>x.id===f.projectId);return `<div class="card file-card"><div class="file-icon">${esc(f.ext||'FILE').slice(0,4)}</div><div class="file-info" onclick="openFileById('${f.id}')"><h3>${esc(f.name)}</h3><p>${esc(p?.name||'Unassigned')} • ${esc(f.date||'No date')} • ${fmtSize(f.size)}</p><p>${f.demo?'Demo metadata only':esc(f.originalName||'')} ${f.nativeFileId?'• Phone copy':(f.blob?'• App copy':'• No content')}</p></div><button class="small secondary" onclick="toggleFav('files','${f.id}')">${f.favorite?'★':'☆'}</button><button class="small secondary" onclick="editFileById('${f.id}')">Edit</button></div>`};
const noteCard=n=>`<div class="card"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="muted">${esc(ps.find(p=>p.id===n.projectId)?.name||'Unassigned')} • ${esc(n.date||'')}</div><button class="small danger" onclick="deleteNote('${n.id}')">Delete</button></div>`;
let out='';
if(page==='home'){out=`<div class="actions"><button onclick="projectForm()">＋ Add New Project</button><button onclick="fileImport()">⇧ Import from Phone</button><button class="secondary" onclick="photoImport()">▧ Add Photo</button><button class="secondary" onclick="calculator()">⌗ Quick Calculator</button></div><div class="notice">🔒 Local-first mode: imported files and metadata stay in this browser's local storage. No login or cloud sync. Use Backup & Restore regularly.</div><div class="section-head"><h2>Recent Projects</h2><button class="small secondary" onclick="page='projects';render()">View all</button></div><div class="grid">${matchedP.sort((a,b)=>b.created-a.created).slice(0,4).map(projectCard).join('')||'<div class="empty">No projects found.</div>'}</div><div class="section-head"><h2>Recent Files</h2><button class="small secondary" onclick="page='files';render()">View all</button></div><div class="list">${matchedF.sort((a,b)=>b.created-a.created).slice(0,5).map(fileCard).join('')||'<div class="empty">Import your first file to get started.</div>'}</div><div class="section-head"><h2>Categories</h2></div><div class="grid">${[['PDFs','PDF'],['Images','IMG'],['CAD','DWG'],['Documents','DOC'],['Other','FILE']].map(([c,i])=>`<div class="card" onclick="page='files';query='';$('#search').value='';renderCategory('${c}')"><div class="between"><h3>${i}</h3><span class="tag">${fs.filter(f=>f.category===c).length}</span></div><div class="muted">${c}</div></div>`).join('')}</div><div class="section-head"><h2>Favorites</h2></div><div class="list">${matchedP.filter(p=>p.favorite).slice(0,3).map(projectCard).join('')}${matchedF.filter(f=>f.favorite).slice(0,3).map(fileCard).join('')||''}</div>`}
if(page==='projects')out=`<div class="section-head"><h2>Projects / Roads</h2><button onclick="projectForm()">＋ New</button></div><div class="grid">${matchedP.map(projectCard).join('')||'<div class="empty">No matching projects.</div>'}</div>`;
if(page==='files')out=`<div class="section-head"><h2>All Files</h2><button onclick="fileImport()">⇧ Import</button></div><div class="toolbar">${['All','PDFs','Images','CAD','Documents','Other'].map(c=>`<button class="pill" onclick="renderCategory('${c}')">${c}</button>`).join('')}</div><div id="categoryList" class="list">${matchedF.map(fileCard).join('')||'<div class="empty">No matching files.</div>'}</div>`;
if(page==='favorites')out=`<div class="section-head"><h2>Favorites</h2></div><div class="grid">${matchedP.filter(p=>p.favorite).map(projectCard).join('')}</div><div class="list">${matchedF.filter(f=>f.favorite).map(fileCard).join('')||'<div class="empty">No favorite files yet.</div>'}</div>`;
if(page==='more')out=`<div class="section-head"><h2>Tools & Settings</h2></div><div class="list"><div class="card"><h3>Project Notes</h3><p class="muted">Searchable notes stored locally.</p><button onclick="addNote()">＋ Add Note</button></div>${matchedN.map(noteCard).join('')}<div class="card"><h3>Backup & Restore</h3><p class="muted">Export metadata as JSON. File contents can be included in a local backup when supported by your browser.</p><div class="sheet-actions"><button onclick="backup(false)">Export metadata</button><button onclick="backup(true)">Full local backup</button><button class="secondary" onclick="$('#restoreInput').click()">Restore backup</button><input id="restoreInput" class="hidden" type="file" accept=".json,application/json" onchange="restoreBackup(this.files[0])"></div></div><div class="card"><h3>Appearance</h3><p class="muted">Switch between light and dark mode.</p><button class="secondary" onclick="toggleTheme()">Toggle theme</button></div><div class="card"><h3>Storage & Privacy</h3><p class="muted">No account, cloud database, or automatic uploads. Browser storage can be cleared by Android/Chrome or lost if this app data is removed. Export backups to a safe phone folder. Large files may exceed browser storage limits.</p><button class="secondary" onclick="storageStatus()">Check local storage</button></div></div>`;
app.innerHTML=out||'<div class="empty">Nothing to show.</div>'}
async function renderCategory(c){let fs=await all('files'),ps=await all('projects');let list=$('#categoryList');if(!list)return;list.innerHTML=fs.filter(f=>(c==='All'||f.category===c)&&(matches(f)||matches(ps.find(p=>p.id===f.projectId)||{}))).map(f=>`<div class="card file-card"><div class="file-icon">${esc(f.ext||'FILE').slice(0,4)}</div><div class="file-info" onclick="openFileById('${f.id}')"><h3>${esc(f.name)}</h3><p>${esc(ps.find(p=>p.id===f.projectId)?.name||'Unassigned')} • ${esc(f.date||'')} • ${fmtSize(f.size)}</p><p>${esc(f.originalName||'')}</p></div><button class="small secondary" onclick="toggleFav('files','${f.id}')">${f.favorite?'★':'☆'}</button><button class="small secondary" onclick="editFileById('${f.id}')">Edit</button></div>`).join('')||'<div class="empty">No files in this category.</div>'}
async function openFileById(id){let f=(await all('files')).find(x=>x.id===id);if(f)openFile(f)}
async function editFileById(id){let f=(await all('files')).find(x=>x.id===id);if(f)editFile(f)}
async function renderProject(p,fs,ns){let pf=fs.filter(f=>f.projectId===p.id),pn=ns.filter(n=>n.projectId===p.id);$('#app').innerHTML=`<button class="secondary small" onclick="currentProject=null;render()">← Back</button><div class="section-head"><h2>${esc(p.name)}</h2><button class="secondary small" onclick="projectFormById('${p.id}')">Edit</button></div><div class="card"><div class="between"><div><h3>${esc(p.road||'Road not set')}</h3><p class="muted">${esc(p.code||'')} • ${esc(p.location||'')} • ${esc(p.date||'')}</p></div><button class="secondary" onclick="toggleFav('projects','${p.id}')">${p.favorite?'★':'☆'}</button></div><p>${esc(p.description||'')}</p><div>${(p.tags||'').split(',').filter(Boolean).map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</div><div class="stats"><div class="stat"><strong>${pf.filter(f=>f.category==='PDFs').length}</strong><span>PDFs</span></div><div class="stat"><strong>${pf.filter(f=>f.category==='Images').length}</strong><span>Photos</span></div><div class="stat"><strong>${pf.filter(f=>f.category==='CAD').length}</strong><span>CAD</span></div><div class="stat"><strong>${pn.length}</strong><span>Notes</span></div></div></div><div class="actions" style="margin-top:12px"><button onclick="fileImportForProject('${p.id}')">⇧ Add Files</button><button class="secondary" onclick="photoImportForProject('${p.id}')">▧ Add Photos</button><button class="secondary" onclick="addNote('${p.id}')">✎ Add Note</button><button class="danger" onclick="deleteProjectById('${p.id}')">Delete Project</button></div><div class="section-head"><h2>Files & Photos</h2></div><div class="list">${pf.map(f=>`<div class="card file-card"><div class="file-icon">${esc(f.ext||'FILE').slice(0,4)}</div><div class="file-info" onclick="openFileById('${f.id}')"><h3>${esc(f.name)}</h3><p>${esc(f.category)} • ${fmtSize(f.size)} • ${esc(f.date||'')}</p></div><button class="small secondary" onclick="editFileById('${f.id}')">Edit</button><button class="small danger" onclick="deleteFileById('${f.id}')">×</button></div>`).join('')||'<div class="empty">No files assigned yet.</div>'}</div><div class="section-head"><h2>Notes</h2></div><div class="list">${pn.map(n=>`<div class="card"><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p><div class="muted">${esc(n.date||'')} • ${esc(n.tags||'')}</div><button class="small danger" onclick="deleteNote('${n.id}')">Delete note</button></div>`).join('')||'<div class="empty">No notes yet.</div>'}</div>`}
async function projectFormById(id){let p=(await all('projects')).find(x=>x.id===id);if(p)projectForm(p)}
async function deleteProjectById(id){let p=(await all('projects')).find(x=>x.id===id);if(p)deleteProject(p)}
async function deleteFileById(id){let f=(await all('files')).find(x=>x.id===id);if(f)deleteFile(f)}
async function fileImportForProject(id){await fileImport();setTimeout(()=>{let s=$('#bulkProject');if(s)s.value=id},100)}
async function photoImportForProject(id){await photoImport();setTimeout(()=>{let s=$('#photoProject');if(s)s.value=id},100)}
async function deleteNote(id){if(!confirm('Delete this note?'))return;await del('notes',id);render()}
async function blobToBase64(blob){let bytes=new Uint8Array(await blob.arrayBuffer());let parts=[];const step=0x8000;for(let i=0;i<bytes.length;i+=step)parts.push(String.fromCharCode(...bytes.subarray(i,Math.min(i+step,bytes.length))));return btoa(parts.join(''))}async function base64ToBlob(data,type){let raw=atob(data),out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return new Blob([out],{type:type||'application/octet-stream'})}async function backup(full){let [projects,files,notes]=await Promise.all([all('projects'),all('files'),all('notes')]);if(full&&!confirm('Full backup actual file bytes include karega. Bari files ki wajah se temporary memory zyada use ho sakti hai. Continue?'))return;try{let out=[];for(let f of files){let o={...f};delete o.blob;if(full){if(f.blob)o.blobData=await blobToBase64(f.blob);else o.blobData=null;o.nativeFileId='';}out.push(o)}let payload={app:'Road Survey Manager',version:2,fullBackup:!!full,created:new Date().toISOString(),projects,notes,files:out};let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});downloadBlob(blob,`road-survey-${full?'complete-':'metadata-'}backup-${new Date().toISOString().slice(0,10)}.json`);alert(full?'Complete backup export started. Is JSON mein available imported file bytes shamil hain. Large files ki wajah se backup bohat bara ho sakta hai.':'Metadata backup export started.')}catch(e){alert('Backup fail hui: '+(e.message||e))}}
async function downloadBlob(blob,name){if(window.AndroidFiles&&window.AndroidFiles.saveBackupBase64&&name.startsWith('road-survey-')){try{let encoded=await blobToBase64(blob);window.AndroidFiles.saveBackupBase64(encoded,name);return}catch(e){alert('Native backup save nahi ho saka: '+e.message);return}}let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function restoreBackup(file){if(!file)return;if(!confirm('Restore backup? Existing records will be kept. Restored records get new IDs where needed to avoid overwriting current data.'))return;try{let d=JSON.parse(await file.text());if(!d.projects||!d.files)throw Error('Invalid backup');let projectMap={};for(let p of d.projects){let old=p.id,copy={...p,id:uid()};projectMap[old]=copy.id;await put('projects',copy)}for(let f of d.files){let copy={...f,id:uid(),projectId:projectMap[f.projectId]||'',nativeFileId:''};if(f.blobData){copy.blob=await base64ToBlob(f.blobData,f.mime||'application/octet-stream');delete copy.blobData}else{copy.blob=null;delete copy.blobData}await put('files',copy)}for(let n of d.notes||[]){let copy={...n,id:uid(),projectId:projectMap[n.projectId]||''};await put('notes',copy)}alert(d.fullBackup?'Complete backup restored, including embedded file contents when present.':'Metadata restored. This backup did not include file bytes.');render()}catch(e){alert('Restore failed: '+(e.message||e))}}
async function storageStatus(){let est=await navigator.storage?.estimate?.();alert(est?`Browser storage used: ${fmtSize(est.usage||0)}\nQuota estimate: ${fmtSize(est.quota||0)}\nStorage persistence: ${navigator.storage?.persisted?await navigator.storage.persisted():'not available'}`:'Storage estimates are not supported by this browser.')}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('rsm-theme',document.documentElement.dataset.theme)}
if(localStorage.getItem('rsm-theme'))document.documentElement.dataset.theme=localStorage.getItem('rsm-theme');
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
