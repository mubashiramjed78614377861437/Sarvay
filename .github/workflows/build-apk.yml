name: Build Road Survey Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project
        run: |
          find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f gradlew.bat ]; then
            echo "Android Gradle wrapper needs to be added for Linux builds."
            exit 1
          else
            echo "Gradle wrapper not found at repository root."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Road-Survey-Manager-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
